[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "one45-schedule-wrangler"
version = "0.2.0"
description = "One45 Schedule Wrangler: build a Batch Import from a Batch of Partner Workbooks"
requires-python = ">=3.9"
dependencies = ["openpyxl>=3.1,<4.0"]

[tool.setuptools]
py-modules = ["wrangler", "wrangler_gui"]

[tool.ruff.lint]
select = ["F", "E9"]

[project.scripts]
one45-schedule-wrangler = "wrangler:main"
